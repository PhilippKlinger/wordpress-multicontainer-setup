services:
  app:
    container_name: ${APP_NAME:-devsecops-app}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-alpine:TODO_VERSION}
        CONTAINER_PORT: ${CONTAINER_PORT:-TODO_CONTAINER_PORT}
    image: ${APP_IMAGE_NAME:-devsecops-app}:${APP_VERSION:-latest}
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-TODO_HOST_PORT}:${CONTAINER_PORT:-TODO_CONTAINER_PORT}"
    volumes:
      - app_data:${DATA_DIR:-/data}
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:

volumes:
  app_data:
