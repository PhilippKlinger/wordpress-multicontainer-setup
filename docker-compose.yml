services:
  wordpress:
    image: wordpress:${WORDPRESS_VERSION:-7.0.2-php8.3-apache}
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?WORDPRESS_DB_USER is required}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required}
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - wordpress_network

  db:
    image: mariadb:${MARIADB_VERSION:-11.4.12}
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:?WORDPRESS_DB_USER is required}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - wordpress_network

networks:
  wordpress_network:

volumes:
  wordpress_data:
  db_data:
